tags:
  ContractNegotiationAPIController:
    name: Contract negotiation
    description: >-
      Manage negotiations as either consumer or provider. The state machine progresses through REQUESTED, OFFERED,
      ACCEPTED, AGREED, VERIFIED, and FINALIZED, with TERMINATED available from intermediate states. Actual
      transitions depend on the current state: REQUESTED may become OFFERED, AGREED, or TERMINATED; OFFERED may
      return to REQUESTED, become ACCEPTED, or terminate; ACCEPTED may become AGREED or terminate; AGREED may
      become VERIFIED or terminate; VERIFIED may become FINALIZED or terminate.
  AgreementAPIController:
    name: Agreement
    description: Evaluate policy constraints for an existing contract agreement.
  ContractNegotiationProviderController:
    name: DSP negotiation (provider)
    description: >-
      Receive consumer negotiation messages as the provider. DSP 2025-1 JSON-LD requests require
      ROLE_CONNECTOR authentication.
  ContractNegotiationConsumerCallbackController:
    name: DSP negotiation (consumer callbacks)
    description: >-
      Receive provider negotiation messages as the consumer. DSP 2025-1 JSON-LD requests require
      ROLE_CONNECTOR authentication.

operations:
  getContractNegotiationById:
    summary: Get a contract negotiation
    description: >-
      Return a negotiation by its internal ID, including its current state, consumer and provider PIDs, offer,
      agreement, and participant role where available. This lookup does not trigger a protocol message.
  getContractNegotiations:
    summary: List contract negotiations
    description: >-
      Return a paginated list of negotiations matching dynamic request-parameter filters. Query parameters matching
      persisted negotiation fields are interpreted by the filter builder; page defaults to 0, size to 20, and sort
      to timestamp,desc. This read does not send protocol messages.
  sendContractRequestMessage:
    summary: Start a negotiation as consumer
    description: >-
      Start a new negotiation by supplying Forward-To and an offer. The connector sends a ContractRequestMessage to
      the provider, stores the returned negotiation and offer on success, and returns the resulting negotiation.
      This is the new-negotiation variant; use /{contractNegotiationId}/request to send a counteroffer on an
      existing negotiation.
    requestExamples:
      New contract request: contract-request
  sendContractRequestMessageAsCounteroffer:
    summary: Send a consumer counteroffer
    description: >-
      Send a revised offer for an existing negotiation. The connector validates the offer, sends a
      ContractRequestMessage to the provider callback, and updates the stored negotiation when the peer accepts it.
    requestExamples:
      Consumer counteroffer: contract-counteroffer
  sendContractNegotiationEventMessageAccepted:
    summary: Accept a negotiation
    description: >-
      Accept the current offer as the consumer. The connector sends a ContractNegotiationEventMessage with event
      type ACCEPTED to the provider and records ACCEPTED after a successful callback response.
  sendContractAgreementVerificationMessage:
    summary: Verify an agreement
    description: >-
      Verify the agreed contract as the consumer. The connector sends a ContractAgreementVerificationMessage to the
      provider and records VERIFIED only after the provider responds successfully.
  sendContractOfferMessage:
    summary: Start a negotiation as provider
    description: >-
      Start a new negotiation by supplying Forward-To and an offer. The connector sends a ContractOfferMessage to
      the consumer and stores the returned negotiation and offer on success. This is the new-negotiation variant;
      use /{contractNegotiationId}/offer to send a counteroffer on an existing negotiation.
    requestExamples:
      New contract offer: contract-offer
  sendContractOfferMessageAsCounteroffer:
    summary: Send a provider counteroffer
    description: >-
      Send a revised offer to the consumer for an existing negotiation. The connector validates the offer and
      current transition, sends a ContractOfferMessage to the consumer callback, and updates the stored offer and
      negotiation after a successful response.
    requestExamples:
      Provider counteroffer: offer-counteroffer
  sendContractAgreementMessage:
    summary: Agree to a negotiation
    description: >-
      Agree to the negotiation as provider. The connector derives an Agreement from the current offer, sends a
      ContractAgreementMessage to the consumer, and saves the agreement and AGREED negotiation state after a
      successful callback response.
  sendContractNegotiationEventMessageFinalize:
    summary: Finalize a negotiation
    description: >-
      Finalize a verified negotiation as provider. The connector sends a ContractNegotiationEventMessage with event
      type FINALIZED to the consumer, records FINALIZED after a successful callback, and initializes the transfer
      process for the resulting agreement. The endpoint returns a success response rather than the updated negotiation.
  sendContractNegotiationTerminationMessage:
    summary: Terminate a negotiation
    description: >-
      Terminate an existing negotiation from either participant role. The connector sends a
      ContractNegotiationTerminationMessage to the counterparty callback, then records TERMINATED after success.
  enforceAgreement:
    summary: Enforce an agreement
    description: >-
      Load the agreement by ID (scoped to the current tenant when one is active) and evaluate its policy using the
      agreement enforcement point. A valid decision returns success; a denied decision raises a policy enforcement
      error. This endpoint does not alter negotiation state.
  ContractNegotiationProviderController.getNegotiationByProviderPid:
    controllerName: ContractNegotiationProviderController
    methodName: getNegotiationByProviderPid
    summary: Retrieve a provider-side negotiation
    description: >-
      Requires ROLE_CONNECTOR authorization. Return the JSON-LD negotiation associated with the provider PID for
      this tenant.
    responses:
      "200":
        description: JSON-LD ContractNegotiation document.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the provider PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationProviderController.handleContractRequestMessage:
    controllerName: ContractNegotiationProviderController
    methodName: handleContractRequestMessage
    summary: Receive an initial contract request
    description: >-
      Requires ROLE_CONNECTOR authorization. Process a consumer ContractRequestMessage and create a provider-side
      negotiation in REQUESTED state.
    requestExamples:
      Initial contract request: contract-request-initial
    responses:
      "201":
        description: JSON-LD ContractNegotiation created for the request.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationProviderController.handleContractRequestMessageAsCounteroffer:
    controllerName: ContractNegotiationProviderController
    methodName: handleContractRequestMessageAsCounteroffer
    summary: Receive a consumer counteroffer
    description: >-
      Requires ROLE_CONNECTOR authorization. Process a counteroffer for the existing provider PID and update the
      negotiation after validation.
    requestExamples:
      Consumer counteroffer: contract-request-counteroffer
    responses:
      "200":
        description: JSON-LD updated ContractNegotiation document.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the provider PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationProviderController.handleContractNegotiationEventMessageAccepted:
    controllerName: ContractNegotiationProviderController
    methodName: handleContractNegotiationEventMessageAccepted
    summary: Receive consumer acceptance
    description: >-
      Requires ROLE_CONNECTOR authorization. Process an ACCEPTED ContractNegotiationEventMessage from the consumer
      and advance the provider-side negotiation.
    requestExamples:
      Accepted event: contract-negotiation-event-accepted
    responses:
      "200":
        description: JSON-LD updated ContractNegotiation document.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the provider PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationProviderController.handleContractAgreementVerificationMessage:
    controllerName: ContractNegotiationProviderController
    methodName: handleContractAgreementVerificationMessage
    summary: Receive agreement verification
    description: >-
      Requires ROLE_CONNECTOR authorization. Process the consumer's ContractAgreementVerificationMessage and advance
      the negotiation only when verification succeeds.
    requestExamples:
      Agreement verification: contract-agreement-verification
    responses:
      "200":
        description: Empty response after agreement verification is processed.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the provider PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationProviderController.handleContractNegotiationTerminationMessage:
    controllerName: ContractNegotiationProviderController
    methodName: handleContractNegotiationTerminationMessage
    summary: Receive a consumer termination
    description: >-
      Requires ROLE_CONNECTOR authorization. Process a consumer ContractNegotiationTerminationMessage and terminate
      the provider-side negotiation when its current state permits.
    requestExamples:
      Termination: contract-negotiation-termination
    responses:
      "200":
        description: Empty response after termination is processed.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the provider PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.getNegotiationByConsumerPid:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: getNegotiationByConsumerPid
    summary: Retrieve a consumer-side negotiation
    description: >-
      Requires ROLE_CONNECTOR authorization. Return the JSON-LD negotiation associated with the consumer PID for
      this tenant.
    responses:
      "200":
        description: JSON-LD ContractNegotiation document.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the consumer PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.handleContractOfferMessage:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: handleContractOfferMessage
    summary: Receive an initial contract offer
    description: >-
      Requires ROLE_CONNECTOR authorization. Process the provider's initial ContractOfferMessage and create the
      consumer-side negotiation.
    requestExamples:
      Initial contract offer: contract-offer-initial
    responses:
      "201":
        description: JSON-LD ContractNegotiation created for the offer.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.handleContractOfferMessageAsCounteroffer:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: handleContractOfferMessageAsCounteroffer
    summary: Receive a provider counteroffer
    description: >-
      Requires ROLE_CONNECTOR authorization. Process a provider counteroffer for the existing consumer PID and
      update the consumer-side negotiation after validation.
    requestExamples:
      Provider counteroffer: contract-offer-counteroffer
    responses:
      "200":
        description: JSON-LD updated ContractNegotiation document.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the consumer PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.handleContractAgreementMessage:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: handleContractAgreementMessage
    summary: Receive a contract agreement
    description: >-
      Requires ROLE_CONNECTOR authorization. Process the provider's ContractAgreementMessage and store the
      agreement for the consumer-side negotiation.
    requestExamples:
      Agreement: contract-agreement
    responses:
      "200":
        description: Empty response after the agreement is processed.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the consumer PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.handleContractNegotiationEventMessageFinalize:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: handleContractNegotiationEventMessageFinalize
    summary: Receive negotiation finalization
    description: >-
      Requires ROLE_CONNECTOR authorization. Process the provider's FINALIZED ContractNegotiationEventMessage and
      finalize the consumer-side negotiation.
    requestExamples:
      Finalized event: contract-negotiation-event-finalized
    responses:
      "200":
        description: Empty response after finalization is processed.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the consumer PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
  ContractNegotiationConsumerCallbackController.handleContractNegotiationTerminationMessage:
    controllerName: ContractNegotiationConsumerCallbackController
    methodName: handleContractNegotiationTerminationMessage
    summary: Receive a provider termination
    description: >-
      Requires ROLE_CONNECTOR authorization. Process a provider ContractNegotiationTerminationMessage and terminate
      the consumer-side negotiation when its current state permits.
    requestExamples:
      Termination: contract-negotiation-termination
    responses:
      "200":
        description: JSON-LD termination acknowledgment.
      "400":
        description: JSON-LD ContractNegotiationErrorMessage with consumerPid, providerPid, code, and reason.
      "404":
        description: JSON-LD ContractNegotiationErrorMessage when the consumer PID is not found.
      "401":
        description: Missing or invalid connector bearer token.
      "403":
        description: The authenticated token does not have ROLE_CONNECTOR.
