name: Integration Tests

on:
  push:
    branches: [ "feature/*", "hotfix/*", "fix/*" ]

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  CONNECTOR_IMAGE_NAME: engineering-research-and-development/dsp-true-connector
  DCP_ISSUER_IMAGE_NAME: dcp-issuer

jobs:
  build-connector-image:
    name: Build Connector Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.CONNECTOR_IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./connector
          file: ./connector/Dockerfile
          no-cache: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.CONNECTOR_IMAGE_NAME }}:test
          labels: ${{ steps.meta.outputs.labels }}

  build-dcp-issuer-image:
    name: Build DCP Issuer Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build entire DCP module with Maven
        run: mvn -B clean package -DskipTests --file dcp/pom.xml

      - name: Log in to the Container registry - DCP Issuer
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for connector Docker image - DCP Issuer
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.DCP_ISSUER_IMAGE_NAME }}

      - name: Build DCP Issuer Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./dcp/dcp-issuer
          file: ./dcp/dcp-issuer/Dockerfile
          push: false
          tags: ${{ env.DCP_ISSUER_IMAGE_NAME }}:test
          outputs: type=docker,dest=/tmp/dcp-issuer-image.tar

      - name: Upload DCP Issuer Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: dcp-issuer-image
          path: /tmp/dcp-issuer-image.tar
          retention-days: 1

  integration-tests:
    name: ${{ matrix.test-suite }} (${{ matrix.mode }})
    needs: [build-connector-image, build-dcp-issuer-image]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard tests (without DCP)
          - test-suite: api-endpoints-tests
            collection: ./ci/docker/test-cases/api-tests/api-endpoints-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: dataset-api-tests
            collection: ./ci/docker/test-cases/dataset-api-tests/dataset-api-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: connector-tests
            collection: ./ci/docker/test-cases/connector-tests/connector-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          # Tests that run in both modes
          - test-suite: negotiation-api-without-counteroffer-tests
            collection: ./ci/docker/test-cases/negotiation-api-without-counteroffer-tests/negotiation-api-without-counteroffer-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: negotiation-api-without-counteroffer-tests
            collection: ./ci/docker/test-cases/negotiation-api-without-counteroffer-tests/negotiation-api-without-counteroffer-tests.json
            docker-compose-file: ./ci/docker/docker-compose-dcp.yml
            mode: dcp
            requires-dcp: true
            requires-vc: true

          - test-suite: datatransfer-api-http-pull-tests
            collection: ./ci/docker/test-cases/datatransfer-api-http-pull-tests/datatransfer-api-http-pull-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: datatransfer-api-http-pull-tests
            collection: ./ci/docker/test-cases/datatransfer-api-http-pull-tests/datatransfer-api-http-pull-tests.json
            docker-compose-file: ./ci/docker/docker-compose-dcp.yml
            mode: dcp
            requires-dcp: true
            requires-vc: true

          - test-suite: datatransfer-api-http-push-tests
            collection: ./ci/docker/test-cases/datatransfer-api-http-push-tests/datatransfer-api-http-push-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: datatransfer-api-http-push-tests
            collection: ./ci/docker/test-cases/datatransfer-api-http-push-tests/datatransfer-api-http-push-tests.json
            docker-compose-file: ./ci/docker/docker-compose-dcp.yml
            mode: dcp
            requires-dcp: true
            requires-vc: true

          - test-suite: negotiation-api-with-counteroffer-tests
            collection: ./ci/docker/test-cases/negotiation-api-with-counteroffer-tests/negotiation-api-with-counteroffer-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: api-endpoints-tenant-tests
            collection: ./ci/docker/test-cases/api-tests-tenant/api-endpoints-tenant-tests.json
            docker-compose-file: ./ci/docker/docker-compose.yml
            mode: standard
            requires-dcp: false

          - test-suite: dcp-credential-issuance-tests
            collection: ./ci/docker/test-cases/dcp-credential-issuance-tests/dcp-credential-issuance-tests.json
            docker-compose-file: ./ci/docker/docker-compose-dcp.yml
            mode: dcp
            requires-dcp: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download DCP Issuer Docker image artifact
        if: matrix.requires-dcp == true
        uses: actions/download-artifact@v8
        with:
          name: dcp-issuer-image
          path: /tmp

      - name: Load DCP Issuer Docker image
        if: matrix.requires-dcp == true
        run: docker load --input /tmp/dcp-issuer-image.tar

      - name: Verify DCP Docker image
        if: matrix.requires-dcp == true
        run: |
          echo "Verifying DCP Issuer image..."
          docker images
          docker inspect ${{ env.DCP_ISSUER_IMAGE_NAME }}:test

      - name: Start Docker Compose services
        run: docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env up -d

      - name: Wait for connectors to be healthy
        run: |
          echo "Waiting for connector-a (port 8080) and connector-b (port 8090)..."
          for i in $(seq 1 36); do
            A=$(curl -sf http://localhost:8080/actuator/health -o /dev/null && echo ok || echo fail)
            B=$(curl -sf http://localhost:8090/actuator/health -o /dev/null && echo ok || echo fail)
            if [ "$A" = "ok" ] && [ "$B" = "ok" ]; then
              echo "Both connectors healthy after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/36 — connector-a=$A connector-b=$B — waiting 10s..."
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health || (echo "connector-a unhealthy" && docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env logs connector-a && exit 1)
          curl -sf http://localhost:8090/actuator/health || (echo "connector-b unhealthy" && docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env logs connector-b && exit 1)

      - name: Check DCP Issuer health
        if: matrix.requires-dcp == true
        run: |
          echo "Checking DCP Issuer health endpoint..."
          for i in {1..10}; do
            if curl -f http://localhost:8084/actuator/health; then
              echo "DCP Issuer is healthy"
              break
            fi
            echo "Attempt $i: DCP Issuer not ready yet, waiting..."
            sleep 5
          done
          curl -sf http://localhost:8084/actuator/health || (echo "dcp-issuer unhealthy" && docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env logs dcp-issuer && exit 1)

      - name: Check if the container is up and running
        run: docker ps -a

      - name: Obtain Verifiable Credentials (DCP mode only)
        if: matrix.requires-vc == true
        run: npx --yes newman run ./ci/docker/test-cases/dcp-obtain-vc/dcp-gha-tests.postman_collection.json

      - name: Run ${{ matrix.test-suite }}
        run: npx --yes newman run ${{ matrix.collection }}

      - name: Dump docker logs on failure
        if: failure()
        run: |
          for service in $(docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env config --services); do
            echo "::group::Docker logs for $service"
            docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env logs "$service" || true
            echo "::endgroup::"
          done

      - name: Stop Docker Compose services
        if: always()
        run: docker compose -f ${{ matrix.docker-compose-file }} --env-file ./ci/docker/.env down -v

