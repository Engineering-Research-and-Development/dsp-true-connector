name: Release new version
run-name: Release new version ${{ inputs.releaseVersion }}

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Release and tag version  (ie 1.5.0)'
        required: true

jobs:
  release_version:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
      pull-requests: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: engineering-research-and-development/dsp-true-connector
      GITHUB_USERNAME: ${{ github.actor }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Git credentials
        run: |
          git config user.name "GitHub Actions"
          git config user.email noreply@github.com

      - name: Set release version in pom.xml
        shell: bash -l {0}
        run: |
          mvn versions:set-property -Dproperty=revision -DnewVersion=${{ github.event.inputs.releaseVersion }}

      - name: Build DSP TRUEConnector and upload release to GitHub
        shell: bash -l {0}
        run: |
          mvn clean verify
          git add pom.xml
          git commit -m "Release ${{ github.event.inputs.releaseVersion }}"
          git push

      - name: Tag the project
        shell: bash -l {0}
        run: |
          git tag ${{ github.event.inputs.releaseVersion }} -m "Release ${{ github.event.inputs.releaseVersion }}"
          git push origin ${{ github.event.inputs.releaseVersion }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ env.TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.releaseVersion }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./connector
          file: ./connector/Dockerfile
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ github.event.inputs.releaseVersion }}"
          tag_name: ${{ github.event.inputs.releaseVersion }}
          body: "Release version ${{ github.event.inputs.releaseVersion }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}

      - name: Merge main into develop and bump to next snapshot version
        shell: bash -l {0}
        run: |
          # Calculate next version (increment patch version)
          CURRENT_VERSION="${{ github.event.inputs.releaseVersion }}"
          NEXT_VERSION=$(echo "$CURRENT_VERSION" | awk -F. -v OFS=. '{$NF++;print}')
          NEXT_SNAPSHOT="${NEXT_VERSION}-SNAPSHOT"

          echo "Current release version: $CURRENT_VERSION"
          echo "Next snapshot version: $NEXT_SNAPSHOT"

          # Switch to develop branch
          git fetch origin main develop
          git checkout develop
          git pull origin develop

          # Guard: only run this merge-back when this job is releasing from main,
          # i.e. main actually contains the release commit/tag just created.
          # This keeps main's release history as a real ancestor of develop and
          # prevents the recurring pom.xml (revision) merge conflict on future
          # main <-> develop merges.
          if ! git merge-base --is-ancestor origin/main develop 2>/dev/null; then
            # Merge main into develop, allowing the expected pom.xml conflict
            # on the revision property to surface so it can be force-resolved.
            git merge origin/main --no-commit --no-ff || true

            # Force-resolve any conflicts (expected on pom.xml) by discarding
            # develop's stale snapshot value and setting the next snapshot
            # version explicitly, so the resulting merge commit is deterministic.
            mvn versions:set-property -Dproperty=revision -DnewVersion=$NEXT_SNAPSHOT
            git add -A
            git commit -m "Merge main into develop after release $CURRENT_VERSION, bump to $NEXT_SNAPSHOT"
          else
            # main is already merged into develop (e.g. re-run); just set the
            # next snapshot version without attempting another merge.
            mvn versions:set-property -Dproperty=revision -DnewVersion=$NEXT_SNAPSHOT
            git add pom.xml
            git commit -m "Bump version to $NEXT_SNAPSHOT after release $CURRENT_VERSION"
          fi

          git push origin develop

          echo "✅ Develop branch updated to $NEXT_SNAPSHOT (merged main, release $CURRENT_VERSION)"
