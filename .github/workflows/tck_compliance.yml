name: TCK compliance test
run-name: TCK compliance test

on:
  workflow_dispatch:

jobs:
  tckComplianceTest:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Run docker container for DSPTRUEConnector as TCK profile
        run: docker compose -f ./ci/tck/docker-compose.yml up -d

      - name: Wait for container starting
        run: sleep 30

      - name: Check if the container is up and running
        run: docker ps -a

      - name: Run docker container for TCK Runtime
        id: tck_runtime
        run: |
          docker compose -f ./ci/tck/docker-compose-tck.yml up 2>&1 | tee tck_runtime.log
        continue-on-error: true

      - name: Upload TCK Runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tck-runtime-log
          path: tck_runtime.log
          if-no-files-found: warn

      - name: Check TCK test results
        id: check_results
        run: |
          echo "Checking TCK Runtime logs for test results..."
          if grep -q "Failed tests: 0" tck_runtime.log; then
            echo "### ✅ TCK Compliance Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "No failing tests found in runtime log." >> $GITHUB_STEP_SUMMARY
            echo "✅ TCK tests passed"
            exit 0
          else
            echo "### ❌ TCK Compliance Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "Failing tests detected or log was incomplete." >> $GITHUB_STEP_SUMMARY
            echo "❌ TCK tests failed"
            exit 1
          fi

      - name: Stop docker container TCK Runtime
        if: always()
        run: docker compose -f ./ci/tck/docker-compose-tck.yml down -v

      - name: Stop docker container DSPTRUEConnector as TCK profile
        if: always()
        run: docker compose -f ./ci/tck/docker-compose.yml down -v