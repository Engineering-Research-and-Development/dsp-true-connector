name: Build Develop and increase version

on:
  pull_request:
    branches:
      - develop
    types: [ closed ]

jobs:
  # Guard: release.yml merges main into develop directly (not via PR) and sets
  # the next snapshot version itself, so this job must not run for that merge.
  # This condition also protects against a manual main -> develop PR performing
  # a duplicate version bump on top of the one release.yml already applied.
  increment-version-and-build:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: engineering-research-and-development/dsp-true-connector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Increment version in pom.xml
        run: |
          current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          base_version=${current_version%-SNAPSHOT}
          new_version=$(echo $base_version | awk -F. -v OFS=. '{$NF++;print}')
          mvn versions:set-property -Dproperty=revision -DnewVersion="${new_version}-SNAPSHOT"
          echo "NEW_VERSION=${new_version}-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Build and commit version bump
        run: |
          mvn --version
          mvn -B clean verify --file pom.xml
          git add pom.xml
          git commit -m "New development version $NEW_VERSION"
          git push origin develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=develop

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./connector
          file: ./connector/Dockerfile
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}