            B=$(curl -sf -u admin@mail.com:password http://localhost:8090/api/v1/dataplanes 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])) if d.get('success') else 0)" 2>/dev/null || echo 0)
            if [ "$A" -ge 1 ] && [ "$B" -ge 1 ]; then
