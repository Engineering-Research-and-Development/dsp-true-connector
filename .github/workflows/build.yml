          for i in $(seq 1 36); do
            A=$(curl -sf http://localhost:8080/actuator/health -o /dev/null && echo ok || echo fail)
            B=$(curl -sf http://localhost:8090/actuator/health -o /dev/null && echo ok || echo fail)
            if [ "$A" = "ok" ] && [ "$B" = "ok" ]; then
              echo "Both connectors healthy after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/36 — connector-a=$A connector-b=$B — waiting 10s..."
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health || (echo "connector-a unhealthy" && docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env logs connector-a && exit 1)
          curl -sf http://localhost:8090/actuator/health || (echo "connector-b unhealthy" && docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env logs connector-b && exit 1)

      - name: Wait for data plane containers to be healthy
        run: |
          echo "Waiting for pull DPs (ports 9090 and 9092) to be healthy..."
          for i in $(seq 1 18); do
            PA=$(curl -sf http://localhost:9090/actuator/health -o /dev/null && echo ok || echo fail)
            PB=$(curl -sf http://localhost:9092/actuator/health -o /dev/null && echo ok || echo fail)
            if [ "$PA" = "ok" ] && [ "$PB" = "ok" ]; then
              echo "Both pull DPs healthy after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/18 — pull-a=$PA pull-b=$PB — waiting 10s..."
            sleep 10
          done
          curl -sf http://localhost:9090/actuator/health || (echo "data-plane-http-pull-a unhealthy" && docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env logs data-plane-http-pull-a && exit 1)
          curl -sf http://localhost:9092/actuator/health || (echo "data-plane-http-pull-b unhealthy" && docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env logs data-plane-http-pull-b && exit 1)

      - name: Wait for data planes to register with connectors
        run: |
          echo "Waiting for pull DPs to register (need ≥1 per connector)..."
          for i in $(seq 1 30); do
            A=$(curl -sf -u admin@mail.com:password http://localhost:8080/api/v1/dataplanes 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])) if d.get('success') else 0)" 2>/dev/null || echo 0)
            B=$(curl -sf -u admin@mail.com:password http://localhost:8090/api/v1/dataplanes 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])) if d.get('success') else 0)" 2>/dev/null || echo 0)
            if [ "$A" -ge 1 ] && [ "$B" -ge 1 ]; then
              echo "Pull DPs registered: connector-a=$A, connector-b=$B after $((i * 5)) seconds"
              break
            fi
            echo "Attempt $i/30 — connector-a DPs=$A, connector-b DPs=$B — waiting 5s..."
            sleep 5
          done
          A=$(curl -sf -u admin@mail.com:password http://localhost:8080/api/v1/dataplanes | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))")
          B=$(curl -sf -u admin@mail.com:password http://localhost:8090/api/v1/dataplanes | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('data',[])))")
          [ "$A" -ge 1 ] || (echo "connector-a has $A pull DPs registered" && exit 1)
          [ "$B" -ge 1 ] || (echo "connector-b has $B pull DPs registered" && exit 1)

      - name: Check if the container is up and running
        run: docker ps -a

      - name: Run Newman datatransfer-api-http-pull-tests
        run: npx --yes newman run ./ci/docker/test-cases/datatransfer-api-http-pull-tests/datatransfer-api-http-pull-tests.json

      - name: Dump docker datatransfer-api-http-pull-tests
        if: failure()
        run: docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env --profile pull logs

      - name: Stop docker container datatransfer-api-http-pull-tests
        if: always()
        run: docker compose ${DATATRANSFER_COMPOSE_FILES} --env-file ./ci/docker/.env down -v

