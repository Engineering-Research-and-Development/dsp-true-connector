name: Feature or hotfix build

on:
  push:
    branches: [ "feature/*", "hotfix/*", "fix/*" ]

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: engineering-research-and-development/dsp-true-connector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for connector Docker image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push connector Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ./connector
          file: ./connector/Dockerfile
          no-cache: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:test
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push data-plane-http-pull Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./data-plane/data-plane-http-pull
          file: ./data-plane/data-plane-http-pull/Dockerfile
          no-cache: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-data-plane-http-pull:test

      - name: Build and push data-plane-http-push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./data-plane/data-plane-http-push
          file: ./data-plane/data-plane-http-push/Dockerfile
          no-cache: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-data-plane-http-push:test

  negotiation-api-without-counteroffer-tests:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    
    steps:
      - name: Git Checkout
        uses: actions/checkout@v6

      - name: Run docker container for negotiation-api-without-counteroffer-tests
        run: docker compose -f ./ci/docker/docker-compose.yml --env-file ./ci/docker/.env up -d

      - name: Wait for connectors to be healthy
        run: |
          echo "Waiting for connector-a (port 8080) and connector-b (port 8090)..."
          for i in $(seq 1 36); do
            A=$(curl -sf http://localhost:8080/actuator/health -o /dev/null && echo ok || echo fail)
            B=$(curl -sf http://localhost:8090/actuator/health -o /dev/null && echo ok || echo fail)
            if [ "$A" = "ok" ] && [ "$B" = "ok" ]; then
              echo "Both connectors healthy after $((i * 10)) seconds"
              break
            fi
            echo "Attempt $i/36 — connector-a=$A connector-b=$B — waiting 10s..."
            sleep 10
          done
          curl -sf http://localhost:8080/actuator/health || (echo "connector-a unhealthy" && docker compose -f ./ci/docker/docker-compose.yml --env-file ./ci/docker/.env logs connector-a && exit 1)
          curl -sf http://localhost:8090/actuator/health || (echo "connector-b unhealthy" && docker compose -f ./ci/docker/docker-compose.yml --env-file ./ci/docker/.env logs connector-b && exit 1)

      - name: Check if the container is up and running
        run: docker ps -a

      - name: Run Newman negotiation-api-without-counteroffer-tests
        run: npx --yes newman run ./ci/docker/test-cases/negotiation-api-without-counteroffer-tests/negotiation-api-without-counteroffer-tests.json

      - name: Dump docker negotiation-api-without-counteroffer-tests
        if: failure()
        run: docker compose -f ./ci/docker/docker-compose.yml --env-file ./ci/docker/.env logs

      - name: Stop docker container negotiation-api-without-counteroffer-tests
        if: always()
        run: docker compose -f ./ci/docker/docker-compose.yml --env-file ./ci/docker/.env down -v

