name: Security Vulnerability Scan

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    # Run weekly on Monday at 07:00 UTC to catch newly published CVEs
    - cron: '0 7 * * 1'

jobs:
  trivy-scan:
    name: Trivy SBOM Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # Required to upload SARIF results to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM
        run: mvn -B -q cyclonedx:makeAggregateBom -DskipTests -Dcheckstyle.skip=true

      - name: Scan SBOM with Trivy
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: sbom
          scan-ref: sbom.json
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-dependency-scan
