# -----------------------------------------------------------------------------
# Spring environment overrides - issuer runs on localhost.
# Active when spring.profiles.active includes "issuer-spring".
# -----------------------------------------------------------------------------
# Identity (localhost)
dcp.connector-did=did:web:localhost%3A8082:issuer
dcp.base-url=http://localhost:8082
dcp.host=localhost
# DID Document Service Entries - issuer-location uses localhost
# Spring Boot does not merge list entries across property files: this entry replaces the one in
# application-issuer.properties, so it must repeat id and type for the DID document to advertise an IssuerService
dcp.service-entries[0].id=TRUEConnector-Issuer-Service
dcp.service-entries[0].type=IssuerService
dcp.service-entries[0].issuer-location=http://localhost:8082/issuer/