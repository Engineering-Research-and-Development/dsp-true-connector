spring.application.name=connector
application.automatic.negotiation=${APPLICATION_AUTOMATIC_NEGOTIATION}
application.automatic.negotiation.retry.max=3
application.automatic.negotiation.retry.delay.ms=5000

application.automatic.transfer=${APPLICATION_AUTOMATIC_TRANSFER}
application.automatic.transfer.retry.max=3
application.automatic.transfer.retry.delay.ms=2000

server.port=8090
application.baseURL=${BASE_URL}
spring.application.label=latest
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.enabled=true
server.tomcat.max-http-form-post-size=-1
# MongoDB connection settings
#spring.data.mongodb.authentication-database=admin
spring.data.mongodb.host=${MONGODB_HOST}
spring.data.mongodb.port=${MONGODB_PORT}
spring.data.mongodb.database=${MONGODB_DATABASE}
application.encryption.key=5xplehys9mtcatb
#spring.data.mongodb.username=tc
#spring.data.mongodb.password=password
####
logging.level.org.springframework=INFO
spring.ssl.bundle.jks.connector.key.alias=${KEYSTORE_ALIAS}
spring.ssl.bundle.jks.connector.key.password=${KEY_PASSWORD}
spring.ssl.bundle.jks.connector.keystore.location=/cert/${KEYSTORE_NAME}
spring.ssl.bundle.jks.connector.keystore.password=${KEYSTORE_PASSWORD}
#add private key password
spring.ssl.bundle.jks.connector.keystore.type=JKS
spring.ssl.bundle.jks.connector.truststore.type=JKS
spring.ssl.bundle.jks.connector.truststore.location=/cert/${TRUSTSTORE_NAME}
spring.ssl.bundle.jks.connector.truststore.password=${TRUSTSTORE_PASSWORD}
server.ssl.enabled=${SERVER_SSL_ENABLED}
server.ssl.key-alias=${KEYSTORE_ALIAS}
server.ssl.key-password=${KEY_PASSWORD}
server.ssl.key-store=/cert/${KEYSTORE_NAME}
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-store-type=JKS
# OCSP Validation Configuration
# Enable or disable OCSP validation
application.ocsp.validation.enabled=false
# Soft-fail mode: if true, allows connections when OCSP validation fails
# If false, connections will be rejected when OCSP validation fails
application.ocsp.validation.soft-fail=true
# Default cache duration in minutes for OCSP responses without nextUpdate field
application.ocsp.validation.default-cache-duration-minutes=60
# Timeout in seconds for OCSP responder connections
application.ocsp.validation.timeout-seconds=10
management.endpoints.enabled-by-default=true
management.endpoint.info.enabled=true
#management.security.enabled=false
management.endpoints.web.exposure.include=*
management.endpoint.env.post.enabled=true

# CORS configuration
# Allow specific origins
application.cors.allowed.origins=
# Allow specific HTTP methods
application.cors.allowed.methods=
# Allow specific headers
application.cors.allowed.headers=
# Allow user credentials
application.cors.allowed.credentials=

### Connector ID
application.connectorid=connector_b
###### USAGE CONTROL
application.usagecontrol.enabled=true
application.usagecontrol.constraint.location=EU
application.usagecontrol.constraint.purpose=demo
#### Authentication provider: KEYCLOAK | INTERNAL | DISABLED
application.auth.provider=INTERNAL
# DCP authentication for protocol endpoints — when true, /connector /catalog /negotiations /transfers
# use DCP instead of the provider above. Not valid when provider=DISABLED.
# application.auth.dcp.enabled=false
# Shared HMAC-SHA256 secret for INTERNAL-mode JWT login (application.auth.provider=INTERNAL).
# Must be at least 32 bytes (256 bits). CHANGE THIS IN PRODUCTION — override with the
# APPLICATION_SECURITY_JWT_SECRET env var; never commit a real production secret here.
application.security.jwt.secret=$${APPLICATION_SECURITY_JWT_SECRET:connector-jwt-dev-secret-change-in-prod-min-32-bytes}
application.security.jwt.access-expiration-ms=900000
application.security.jwt.refresh-expiration-ms=604800000

# Keycloak resource server configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/dsp-connector
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/dsp-connector/protocol/openid-connect/certs

# Backend service account credentials for connector-to-connector communication
application.keycloak.backend.client-id=dsp-connector-provider-backend
application.keycloak.backend.client-secret=dsp-connector-provider-secret
application.keycloak.backend.token-url=http://localhost:8180/realms/dsp-connector/protocol/openid-connect/token
application.keycloak.backend.token-caching=true

# UI login properties
application.keycloak.login.client-id=dsp-connector-ui
#application.keycloak.login.client-secret=dsp-connector-ui-secret
application.keycloak.login.token-url=http://localhost:8180/realms/dsp-connector/protocol/openid-connect/token
application.keycloak.login.logout-url=http://localhost:8180/realms/dsp-connector/protocol/openid-connect/logout

#### FTP
application.ftp.host=localhost
application.ftp.defaultTimeoutSeconds=1001
application.ftp.serverPort=2222
application.ftp.serverUsername=ftp_server
application.ftp.serverFolder=
application.ftp.clientUsername=ftp_client
application.ftp.downloadFolder=
## Password strength
application.password.validator.minLength=8
application.password.validator.maxLength=16
application.password.validator.minLowerCase=1
application.password.validator.minUpperCase=1
application.password.validator.minDigit=1
application.password.validator.minSpecial=1
##### S3 Storage Configuration
s3.endpoint=${S3_ENDPOINT}
s3.accessKey=${S3_ACCESS_KEY}
s3.secretKey=${S3_SECRET_KEY}
s3.region=${S3_REGION}
# Public S3 endpoint (can be used with reverse proxy)
s3.externalPresignedEndpoint=${S3_EXTERNAL_PRESIGNED_ENDPOINT}

s3.upload-mode=SYNC
# Chunk size in bytes for multipart uploads (default: 10485760 = 10 MB)
#s3.chunkSize=10485760

# Debug logging for Keycloak authentication
logging.level.it.eng.connector.configuration.KeycloakAuthenticationFilter=INFO
logging.level.it.eng.connector.configuration.KeycloakRealmRoleConverter=INFO
logging.level.org.springframework.security=DEBUG
logging.level.it.eng.tools.auth.keycloak.KeycloakAuthenticationService=INFO
logging.level.it.eng.tools.auth.AuthenticationCache=INFO
logging.level.it.eng.tools.util.CredentialUtils=INFO

# Optional CORS example for the Angular UI

# Optional: disable protocol auth if you want all endpoints to be unprotected (for testing only)
# application.protocol.authentication.enabled=false

# Keycloak Admin REST API (used only when application.auth.provider=KEYCLOAK)
application.keycloak.admin.server-url=http://localhost:8180
application.keycloak.admin.realm=dsp-connector
