services:
  mongodb:
    container_name: mongodb
    image: mongo:7.0.12
    ports:
      - "27017:27017"
    networks:
      - dsp-tc-net
    volumes:
      - mongodb-data:/data/db
      - mongodb-configdb:/data/configdb

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    #docker.io/bitnami/minio:2025
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - dsp-tc-net
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dsp-tc-net
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/dsp-true-connector --ignore-existing;
      echo 'MinIO bucket created successfully';
      exit 0;
      "

  dsp-tc-connector:
    image: ghcr.io/engineering-research-and-development/dsp-true-connector:test
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    logging:
      options:
        max-size: "200M"
    container_name: dsp-tc-connector
    ports:
      - 0.0.0.0:8888:2222 #FTP
      - 8080:8080
    depends_on:
      - mongodb
      - minio-init
    networks:
      - dsp-tc-net
    environment:
      - "JDK_JAVA_OPTIONS=-Xmx1024m"
      - SPRING_PROFILES_ACTIVE=tck
      - CALLBACK_ADDRESS=${CONNECTOR_A_CALLBACK_ADDRESS}
      - KEYSTORE_NAME=${KEYSTORE_NAME}
      - KEY_PASSWORD=${KEY_PASSWORD}
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
      - KEYSTORE_ALIAS=${KEYSTORE_ALIAS}
      - TRUSTSTORE_NAME=${TRUSTSTORE_NAME}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
    volumes:
      - ./connector_tck_resources:/config
      - ./tc_cert:/cert
      - ./:/home/nobody/ftp
      - tc_log:/var/log/tc

  data-plane-http-pull:
    image: ghcr.io/engineering-research-and-development/dsp-true-connector-data-plane-http-pull:test
    container_name: data-plane-http-pull
    networks:
      - dsp-tc-net
    depends_on:
      minio:
        condition: service_healthy
      dsp-tc-connector:
        condition: service_started
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/data-plane-pull
      - DATAPLANE_ID=dp-http-pull
      - DATAPLANE_ENDPOINT=http://data-plane-http-pull:9090
      - DATAPLANE_CONTROL_PLANE_ADMIN_ENDPOINT=http://dsp-tc-connector:8080
      - DATAPLANE_CONTROL_PLANE_REGISTRATION_KEY=internal-service-secret-change-in-prod
      - DATAPLANE_AUTH_TYPE=API_KEY
      - DATAPLANE_API_KEY=changeme
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESSKEY=minioadmin
      - S3_SECRETKEY=minioadmin
      - S3_REGION=us-east-1
      - S3_BUCKETNAME=dsp-true-connector
      - S3_EXTERNAL_PRESIGNED_ENDPOINT=http://minio:9000

volumes:
  mongodb-data:
  mongodb-configdb:
  minio_data:
  tc_log:

networks:
  dsp-tc-net:
    driver: bridge
    name: dsp-tc-net
