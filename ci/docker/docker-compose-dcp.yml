services:
  ### simulated S3 cloud storage
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: s3storage
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
    networks:
      - network-a
      - network-b
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/health" ]
      interval: 30s
      timeout: 20s
      retries: 3

  ### DCP Issuer Service
  dcp-issuer:
    image: ghcr.io/engineering-research-and-development/dcp-issuer:test
    container_name: dcp-issuer
    networks:
      - network-a
      - network-b
    ports:
      - "8084:8084"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - SPRING_APPLICATION_NAME=dcp-issuer
      - SERVER_PORT=8084
      - ISSUER_DID=did:web:dcp-issuer%3A8084:issuer
      - ISSUER_BASE_URL=http://dcp-issuer:8084
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=issuer_db
      - ISSUER_KEYSTORE_PATH=/cert/eckey-issuer.p12
      - ISSUER_KEYSTORE_PASSWORD=password
      - ISSUER_KEYSTORE_ALIAS=issuer
      # Spring Boot will automatically look for application.properties in /config/ due to classpath
      - SPRING_CONFIG_LOCATION=optional:classpath:/,optional:file:/config/
    volumes:
      # Mount external config directory for application.properties and other config files
      - ./issuer/config:/config
      # Mount external cert directory for .p12 keystores and certificates
      - ./issuer/cert:/cert
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mongodb:
    container_name: mongodb
    image: mongo:7.0.12
    networks:
      - network-a
      - network-b
    ports:
      - "27019:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-configdb:/data/configdb

  ### connector instance a
  connector-a:
    image: ghcr.io/engineering-research-and-development/dsp-true-connector:test
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    logging:
      options:
        max-size: "200M"
    networks:
      - network-a
      - network-b
    container_name: connector-a
    ports:
      - "0.0.0.0:8888:2222" #FTP
      - "8080:8080"
    depends_on:
      - mongodb-a
      - rustfs
      - dcp-issuer
    environment:
      - "JDK_JAVA_OPTIONS=-Xmx1024m"
      - BASE_URL=${CONNECTOR_A_BASE_URL}
      - KEYSTORE_NAME=${CONNECTOR_A_KEYSTORE_NAME}
      - KEY_PASSWORD=${CONNECTOR_A_KEY_PASSWORD}
      - KEYSTORE_PASSWORD=${CONNECTOR_A_KEYSTORE_PASSWORD}
      - KEYSTORE_ALIAS=${CONNECTOR_A_KEYSTORE_ALIAS}
      - TRUSTSTORE_NAME=${TRUSTSTORE_NAME}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - CONNECTOR_A_DCP_ENABLED=true
    volumes:
      - ./connector_a_resources:/config
      - ./tc_cert:/cert
      - ./:/home/nobody/ftp
      - tc_a_log:/var/log/tc

  mongodb-a:
    container_name: mongodb-a
    image: mongo:7.0.12
    networks:
      - network-a
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data_a:/data/db
      - mongodb-configdb_a:/data/configdb

  ### connector instance b
  connector-b:
    image: ghcr.io/engineering-research-and-development/dsp-true-connector:test
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    logging:
      options:
        max-size: "200M"
    networks:
      - network-a
      - network-b
    container_name: connector-b
    ports:
      - "0.0.0.0:8889:2222" #FTP
      - "8090:8080"
    depends_on:
      - mongodb-b
      - rustfs
      - dcp-issuer
    environment:
      - "JDK_JAVA_OPTIONS=-Xmx1024m"
      - BASE_URL=${CONNECTOR_B_BASE_URL}
      - KEYSTORE_NAME=${CONNECTOR_B_KEYSTORE_NAME}
      - KEY_PASSWORD=${CONNECTOR_B_KEY_PASSWORD}
      - KEYSTORE_PASSWORD=${CONNECTOR_B_KEYSTORE_PASSWORD}
      - KEYSTORE_ALIAS=${CONNECTOR_B_KEYSTORE_ALIAS}
      - TRUSTSTORE_NAME=${TRUSTSTORE_NAME}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - CONNECTOR_B_DCP_ENABLED=true
    volumes:
      - ./connector_b_resources:/config
      - ./tc_cert:/cert
      - ./:/home/nobody/ftp
      - tc_b_log:/var/log/tc

  mongodb-b:
    container_name: mongodb-b
    image: mongo:7.0.12
    networks:
      - network-b
    ports:
      - "27018:27017"
    volumes:
      - mongodb-data_b:/data/db
      - mongodb-configdb_b:/data/configdb

networks:
  network-a: { }
  network-b: { }

volumes:
  rustfs_data: { }
  tc_a_log: { }
  mongodb-data_a: { }
  mongodb-configdb_a: { }
  tc_b_log: { }
  mongodb-data_b: { }
  mongodb-configdb_b: { }
  mongodb-data: { }
  mongodb-configdb: { }

