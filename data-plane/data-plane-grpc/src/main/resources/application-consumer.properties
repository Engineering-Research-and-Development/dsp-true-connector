server.port=9094
spring.application.name=data-plane-grpc-consumer

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/data-plane-grpc-consumer

# Data Plane self-registration
dataplane.id=${DATAPLANE_ID:dp-grpc-consumer}
dataplane.endpoint=http://localhost:9094
dataplane.control-plane-admin-endpoint=http://localhost:8080

# gRPC server coordinates advertised in prepare responses
grpc.server.port=${GRPC_SERVER_PORT:9095}

# S3 (consumer's S3 for storing streamed artifact data)
s3.bucketName=dsp-true-connector-consumer

# Encryption key for FieldEncryptionService (must match the control plane's key)
application.encryption.key=${APPLICATION_ENCRYPTION_KEY:5m7mlhmu65zsp6x}
