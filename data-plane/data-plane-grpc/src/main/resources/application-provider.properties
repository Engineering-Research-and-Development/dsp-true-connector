server.port=9096
spring.application.name=data-plane-grpc-provider

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/data-plane-grpc-provider

# Data Plane self-registration
dataplane.id=${DATAPLANE_ID:dp-grpc-provider}
dataplane.endpoint=http://localhost:9096
dataplane.control-plane-admin-endpoint=http://localhost:8090

# gRPC server coordinates advertised in prepare responses
grpc.server.port=${GRPC_SERVER_PORT:9097}

# S3 (provider's S3 for reading artifact data)
s3.bucketName=dsp-true-connector-provider

# Encryption key for FieldEncryptionService (must match the control plane's key)
application.encryption.key=${APPLICATION_ENCRYPTION_KEY:5xplehys9mtcatb}
