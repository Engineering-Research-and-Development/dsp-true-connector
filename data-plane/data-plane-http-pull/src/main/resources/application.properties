server.port=9090
spring.application.name=data-plane-http-pull

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/data-plane-pull

# Data Plane self-registration
dataplane.id=${DATAPLANE_ID:dp-http-pull-default}
dataplane.endpoint=http://localhost:9090
dataplane.control-plane-admin-endpoint=http://localhost:8080
dataplane.auth-type=API_KEY
dataplane.api-key=changeme
dataplane.control-plane-admin-secret=${DATAPLANE_CONTROL_PLANE_ADMIN_SECRET:internal-service-secret-change-in-prod}

# S3 (consumer's S3 for storing downloaded files)
s3.endpoint=http://localhost:9000
s3.accessKey=minioadmin
s3.secretKey=minioadmin
s3.region=us-east-1
s3.bucketName=dsp-true-connector-consumer

# Encryption key for FieldEncryptionService (must match the control plane's key)
application.encryption.key=${APPLICATION_ENCRYPTION_KEY:5m7mlhmu65zsp6x}

# TLS: false = insecure noop client (dev); true = TLS with custom truststore
server.ssl.enabled=false

## SSL Configuration (required when server.ssl.enabled=true)
