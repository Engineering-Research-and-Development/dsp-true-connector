server.port=${SERVER_PORT:9090}
spring.application.name=data-plane-http-pull

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/data-plane-pull

# Data Plane self-registration
dataplane.id=${DATAPLANE_ID:dp-http-pull-default}
dataplane.endpoint=${DATAPLANE_ENDPOINT:http://localhost:9090}
dataplane.control-plane-admin-endpoint=${DATAPLANE_CONTROL_PLANE_ADMIN_ENDPOINT:http://localhost:8080}
dataplane.auth-type=${DATAPLANE_AUTH_TYPE:API_KEY}
dataplane.api-key=${DATAPLANE_API_KEY:changeme}
dataplane.control-plane-registration-key=${DATAPLANE_CONTROL_PLANE_REGISTRATION_KEY:dev-only-registration-bootstrap-key-change-me}
dataplane.registration.key-pepper=${DATAPLANE_REGISTRATION_KEY_PEPPER:dev-only-key-pepper-change-in-prod-min-32-bytes}

# S3 upload mode — credentials and bucket are provided per-request by the Control Plane via metadata
s3.upload-mode=SYNC

# Encryption key for FieldEncryptionService (must match the control plane's key)
application.encryption.key=${APPLICATION_ENCRYPTION_KEY:5m7mlhmu65zsp6x}

# TLS: false = insecure noop client (dev); true = TLS with custom truststore
server.ssl.enabled=false

