server.port=9092
spring.application.name=data-plane-http-pull-provider

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/data-plane-pull-provider

# Data Plane self-registration
dataplane.id=${DATAPLANE_ID:dp-http-pull-provider}
dataplane.endpoint=http://localhost:9092
dataplane.control-plane-admin-endpoint=http://localhost:8090

# S3 (provider's S3 for presigned artifact access)
s3.bucketName=dsp-true-connector-provider

# Encryption key for FieldEncryptionService (must match the control plane's key)
application.encryption.key=${APPLICATION_ENCRYPTION_KEY:5xplehys9mtcatb}
